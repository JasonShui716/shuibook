services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shuibook
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: ${API_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}
      TZ: ${TZ}
      DOWNLOAD_IMAGES: ${DOWNLOAD_IMAGES}
    volumes:
      - ./config:/app/config
      - media:/data/media
      - logs:/data/logs
      # Host SSH key path is environment-specific. Provide `REMOTE_FETCH_KEY_HOST_PATH`.
      - ${REMOTE_FETCH_KEY_HOST_PATH:-./secrets/id_remote_fetch}:/root/.ssh/id_remote_fetch:ro
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    command: celery -A app.workers.celery_app worker -l info
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - media:/data/media
      - logs:/data/logs
      - ${REMOTE_FETCH_KEY_HOST_PATH:-./secrets/id_remote_fetch}:/root/.ssh/id_remote_fetch:ro
    depends_on:
      - api
      - redis
      - postgres

  scheduler:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    command: celery -A app.workers.celery_app beat -l info
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - logs:/data/logs
      - ${REMOTE_FETCH_KEY_HOST_PATH:-./secrets/id_remote_fetch}:/root/.ssh/id_remote_fetch:ro
    depends_on:
      - api
      - redis
      - postgres

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        API_INTERNAL_URL: ${API_INTERNAL_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    ports:
      - "3010:3000"
    depends_on:
      - api

volumes:
  pgdata:
  media:
  logs:
  caddy_data:
  caddy_config:
